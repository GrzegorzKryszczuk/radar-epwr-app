# Cotygodniowe podsumowanie pobrań aplikacji (poniedziałek ok. 8:00 czasu polskiego).
# Liczy pobrania pliku radar-epwr.apk ze wszystkich wydań (GitHub Releases) i dopisuje komentarz do zgłoszenia
# „Statystyki pobrań aplikacji” – GitHub wysyła wtedy e-mail właścicielowi repozytorium (powiadomienia o zgłoszeniach).
# Uwaga: to liczba POBRAŃ pliku (także ponownych i aktualizacji), nie liczba unikalnych osób.
name: Podsumowanie pobrań

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pobrania:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const TITLE = 'Statystyki pobrań aplikacji';
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let total = 0; const rows = [];
            for (const r of releases) {
              const apk = (r.assets || []).find((a) => a.name === 'radar-epwr.apk');
              const n = apk ? apk.download_count : 0;
              total += n; rows.push(`| ${r.tag_name} | ${(r.published_at || '').slice(0, 10)} | ${n} |`);
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            let issue = issues.find((i) => i.title === TITLE && !i.pull_request);
            if (!issue) {
              issue = (await github.rest.issues.create({ owner, repo, title: TITLE,
                body: 'Co poniedziałek GitHub Actions dopisuje tu podsumowanie pobrań APK (workflow `pobrania.yml`). Zasubskrybuj zgłoszenie, żeby dostawać e-mail.' })).data;
            }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
            let prev = null;
            for (const c of comments.reverse()) { const m = /<!-- total:(\d+) -->/.exec(c.body || ''); if (m) { prev = +m[1]; break; } }
            const week = prev === null ? 'pierwsze podsumowanie' : `+${total - prev} w ostatnim tygodniu`;
            const date = new Date().toLocaleDateString('pl-PL', { timeZone: 'Europe/Warsaw' });
            const body = [
              `## Pobrania aplikacji Radar EPWR – ${date}`,
              '', `**Łącznie: ${total}** (${week})`, '',
              '| Wersja | Wydana | Pobrania APK |', '|---|---|---|', ...rows, '',
              '_Liczba pobrań pliku z GitHub Releases (także ponownych i aktualizacji) – nie liczba unikalnych osób. Google Play liczy się osobno._',
              `<!-- total:${total} -->`
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            await core.summary.addRaw(body).write();
            core.info(`Łącznie ${total} (${week})`);
